name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          f="$(ls cf_esp*.tar.gz xvcen_cf*.tar.gz cf_esp*.zip xvcen_cf*.zip 2>/dev/null | tail -1)"
          case "$f" in
            *.tar.gz) tar -xzf "$f" ;;
            *.zip) unzip -qo "$f" ;;
          esac
      - name: Build cf_core (NDK)
        working-directory: cf_esp
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++ -std=c++20 -O2 -fno-exceptions -fPIE -pie -static-libstdc++ -Isrc src/*.cpp -o cf_core
      - name: Build APK
        working-directory: cf_esp
        run: sh build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xvcen_cf_apk
          path: cf_esp/cf_esp.apk
